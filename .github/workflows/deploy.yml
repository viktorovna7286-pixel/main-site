name: Deploy to FTP

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Прототип/**'
      - '.github/workflows/deploy-atlas.yml'
      - 'ATLAS-DEPLOY.md'

permissions:
  contents: read

concurrency:
  group: vershina-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /www/vershina8848.ru/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            Прототип/**
            ATLAS-DEPLOY.md
